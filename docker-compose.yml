# Local automation stack for LendLoop: n8n + Mailpit.
# Convex runs on the host via `npx convex dev` (local deployment).
x-n8n-common: &n8n-common
  image: n8nio/n8n:2.48.8
  environment: &n8n-env
    N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
    GENERIC_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
    TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
  secrets:
    - n8n_encryption_key
  volumes:
    - n8n_data:/home/node/.n8n

services:
  n8n-import:
    <<: *n8n-common
    entrypoint: ["/bin/sh", "/n8n/init/init.sh"]
    environment:
      <<: *n8n-env
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LENDLOOP_WEBHOOK_SECRET: ${LENDLOOP_WEBHOOK_SECRET:?run npm run setup}
      LENDLOOP_AUTOMATION_SECRET: ${LENDLOOP_AUTOMATION_SECRET:?run npm run setup}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/n8n:ro
    restart: "no"

  n8n:
    <<: *n8n-common
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      <<: *n8n-env
      N8N_WEBHOOK_URL: http://localhost:5678/
      # Only non-secret config is exposed to workflows via $env (all secrets live in n8n credentials).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      LENDLOOP_CONVEX_URL: ${LENDLOOP_CONVEX_URL_FROM_N8N:-http://host.docker.internal:3211}
      LENDLOOP_APP_URL: ${APP_URL:-http://localhost:3000}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-ops@lendloop.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

secrets:
  n8n_encryption_key:
    file: ./.secrets/n8n_encryption_key

volumes:
  n8n_data:
